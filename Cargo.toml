[package]
name = "csvm-rs"
version = "0.1.0"
edition = "2024"
description = "A fast, multithreaded CSV manipulation tool with a pipe command language."
license = "GPL-3.0"

[lib]
name = "csvm"
path = "src/lib.rs"

[[bin]]
name = "csvm"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

[dependencies]
# MPMC bounded channels for the parse -> work -> write pipeline.
crossbeam-channel = "0.5"
# SIMD-accelerated byte scanning for the zero-copy CSV scanner.
memchr = "2"
# Backs the `=~` / `!~` match operators in `select`.
regex = "1"

[dev-dependencies]
# Reference RFC-4180 parser, used only to confirm our scanner's conformance.
csv = "1"
# Statistics-driven benchmark harness (see benches/).
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
